name: CI

# Build + test quality gate: runs on every push and pull request to master,
# on BOTH Windows and Linux (the app is Avalonia — one codebase ships both,
# so both platforms must stay green). Tests are headless Core unit tests;
# nothing here needs a display or network access.
#
# SDK: 8.0.x — every project targets net8.0 (see the csproj files), so the
# matching LTS SDK is pinned rather than whatever newer SDK happens to be on
# the runner image. This also matches release.yml.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # No packages.lock.json in this repo, so key the cache on the csproj files
      # (where PackageReference versions live) — restore-keys keeps a stale-but-
      # useful cache when a package version changes.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build StockPicker.sln -c Release

      - name: Test
        run: dotnet test StockPicker.Core.Tests/StockPicker.Core.Tests.csproj -c Release --no-build --logger "trx"
